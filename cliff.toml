# git-cliff ~ configuration file
# https://git-cliff.org/docs/configuration

[changelog]
# A Tera template to be rendered as the changelog's header.
# See https://keats.github.io/tera/docs/#introduction
header = """
# Changelog\n
All notable changes to this project will be documented in this file.\n
"""
# A Tera template to be rendered for each release in the changelog.
# See https://keats.github.io/tera/docs/#introduction
body = """
{% if version %}\
    ## {{ version | trim_start_matches(pat="v") }} - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        - {{ commit.message | split(pat="\n") | first | trim_end }}\
    {% endfor %}
{% endfor %}\n
"""
# A Tera template to be rendered as the changelog's footer.
# See https://keats.github.io/tera/docs/#introduction
footer = """
<!-- generated by git-cliff -->
"""
# Remove leading and trailing whitespaces from the changelog's body.
trim = true


[git]
# Parse commits according to the conventional commits specification.
# See https://www.conventionalcommits.org
conventional_commits = true
# Exclude commits that do not match the conventional commits specification.
filter_unconventional = false
# Split commits on newlines, treating each line as an individual commit.
split_commits = false
# An array of regex based parsers for extracting data from the commit message.
# Assigns commits to groups.
# Optionally sets the commit's scope and can decide to exclude commits from further processing.
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^build", group = "Build" },
    { message = "^github-ci", group = "CI" },
    { message = "^meson", group = "Build" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^doc", group = "Documentation" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactor" },
    { message = "^style", group = "Styling" },
    { message = "^test", group = "Testing" },
    { message = "^chore\\(release\\): prepare for", skip = true },
    { message = "^chore", group = "Miscellaneous Tasks" },
    { message = "^Merge pull request", skip = true },
    { message = "^Merge branch", skip = true },
    { message = "^merge", skip = true },
    { message = "^release", skip = true },
    { message = "^git-svn-id", skip = true },
    { message = "^added", group = "Features" },
    { message = "^Add", group = "Features" },
    { message = "^add", group = "Features" },
    { message = "^allow", group = "Features" },
    { message = "^move", group = "Refactor" },
    { message = "^Move", group = "Refactor" },
    { message = "^remove", group = "Refactor" },
    { message = "^update", group = "Refactor" },
    { message = "^rename", group = "Refactor" },
    { message = "^revert", group = "Refactor" },
    { message = "^change", group = "Refactor" },
    { message = "^improve", group = "Refactor" },
    { message = "^eliminate", group = "Refactor" },
    { message = "^corrected", group = "Refactor" },
    { message = "^shortened", group = "Refactor" },
    { message = "^implement", group = "Refactor" },
    { message = "^shortened", group = "Refactor" },
    { message = "^don't", group = "Refactor" },
    { message = "^clean", group = "Refactor" },
    { message = "^make", group = "Refactor" },
    { message = "^made", group = "Refactor" },
    { message = "^leave", group = "Refactor" },
    { message = "^unified", group = "Refactor" },
    { message = "^finished", group = "Refactor" },
    { message = "^replace", group = "Refactor" },
    { message = "^support", group = "Features" },
    { message = "^more", group = "Refactor" },
    { message = ".*clean", group = "Miscellaneous Tasks" },
    { message = "^2", skip = true },
    { message = "^oops", skip = true },
    { message = "^forgot", group = "Refactor" },
    { message = "^handle", group = "Refactor" },
    { message = "^simplified", group = "Refactor" },
    { message = "^make sure", group = "Refactor" },
    { message = "README", group = "Documentation" },
    { message = ".*README", group = "Documentation" },
    { body = ".*security", group = "Security" },
    { body = ".*", group = "Other (unconventional)" },
]
# Exclude commits that are not matched by any commit parser.
filter_commits = false
# Order releases topologically instead of chronologically.
topo_order = false
# Order of commits in each group/release within the changelog.
# Allowed values: newest, oldest
sort_commits = "oldest"
